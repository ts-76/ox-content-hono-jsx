name: Adapter and packed consumer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: adapter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publisher:
    name: Fixed publisher on Node 24.22.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: node scripts/release/install-publisher.mjs
      - run: node --test scripts/release/publisher-bundles.test.mjs
      - run: node scripts/release/check-publisher.mjs
      - run: node scripts/release/publisher-runtime-test.mjs
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          cache: npm
      - run: npm ci --ignore-scripts --omit=peer
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:consumer
      - run: npm run test:consumer
        env:
          OX_HONO_EXAMPLE: custom-host
      - run: node scripts/check-dependencies.mjs
      - name: Pack verified distribution
        run: npm pack --ignore-scripts --pack-destination artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
  provenance:
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-${{ github.sha }}
          path: artifacts
      - name: Install integrity-pinned private publisher
        run: node scripts/release/install-publisher.mjs
      - name: Audit private publisher dependencies
        run: node scripts/release/publisher.mjs --audit
      - name: Sign and verify distribution provenance
        run: node scripts/release/attest.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ github.sha }}
          path: |
            artifacts/*.tgz
            artifacts/*.sigstore
          if-no-files-found: error
          retention-days: 7
